name: Feature request
description: Suggest a research workflow, usability improvement or documentation change.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the task using non-sensitive examples. Do not attach private recordings or identifying data.
        Report vulnerabilities [privately](https://github.com/zazieproductions/spectre-signal/blob/main/SECURITY.md).
  - type: textarea
    id: use-case
    attributes:
      label: What task is difficult today?
      description: Describe who is doing the task and where the current workbench or guide falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like and any alternatives you have considered.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: How would we check the result?
      description: Suggest an observable outcome, ideally using the built-in specimen or another synthetic fixture.
    validations:
      required: true
